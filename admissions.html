      <h1>招生信息</h1>
      <h2>本科生</h2>
      <p>本科招生通常包括高考/统一入学考试成绩或国际招生通道（国际学生），申请者需提交成绩单、推荐信与个人陈述。具体要求以当年招生简章为准。</p>

      <h2>研究生</h2>
      <p>研究生申请需提交本科毕业证、成绩单、研究计划（或个人陈述）与两封推荐信；部分项目需面试或笔试。</p>

      <h2>国际学生</h2>
      <p>国际学生需提供语言证明（如雅思/托福）或参加学校的语言测试，办理签证与住宿安排请提前准备。</p>
