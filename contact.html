<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>联系我们 — 澳门科技大学</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="/">MUST 介绍站</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navmenu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navmenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/about.html">学校简介</a></li>
            <li class="nav-item"><a class="nav-link" href="/academics.html">学院与专业</a></li>
            <li class="nav-item"><a class="nav-link" href="/admissions.html">招生信息</a></li>
            <li class="nav-item"><a class="nav-link" href="/life.html">校园生活</a></li>
            <li class="nav-item"><a class="nav-link" href="/contact.html">联系我们</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container my-5">
      <h1>联系我们</h1>
      <p>以下信息为模板占位，请替换为学校官方联系方式。</p>

      <div class="row">
        <div class="col-md-6">
          <h3>地址</h3>
          <p>澳门某地示例地址</p>

          <h3>电话</h3>
          <p>+853 1234 5678</p>

          <h3>邮箱</h3>
          <p>info@example.edu.mo</p>
        </div>
        <div class="col-md-6">
          <h3>联系表单</h3>
          <form id="contactForm">
            <div class="mb-3">
              <label class="form-label">姓名</label>
              <input class="form-control" id="name" required>
            </div>
            <div class="mb-3">
              <label class="form-label">邮箱</label>
              <input class="form-control" id="email" type="email" required>
            </div>
            <div class="mb-3">
              <label class="form-label">内容</label>
              <textarea class="form-control" id="message" rows="4" required></textarea>
            </div>
            <button class="btn btn-primary" type="submit">发送</button>
            <div id="formAlert" class="mt-3" style="display:none;"></div>
          </form>
          <p class="mt-2 small text-muted">说明：当前为前端演示表单。要启用后端邮件功能，可使用 Formspree、Netlify Forms 或自己后端。</p>
        </div>
      </div>

      <a class="btn btn-secondary mt-3" href="/">返回首页</a>
    </main>

    <footer class="bg-primary text-white py-4 mt-auto">
      <div class="container text-center small">&copy; 2026 澳门科技大学介绍站 模板</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.getElementById('contactForm').addEventListener('submit', function(e){
        e.preventDefault();
        // 前端演示：不提交，仅显示提示
        var alert = document.getElementById('formAlert');
        alert.style.display = 'block';
        alert.className = 'alert alert-success';
        alert.innerText = '感谢你的消息！（表单为演示，未实际发送）';
        this.reset();
      });
    </script>
  </body>
</html>
